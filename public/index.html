<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KBIS Portal — Sign in</title>
<meta name="description" content="Knowledge Base International Schools — secure portal for school fees, payments and school information.">
<meta name="theme-color" content="#f4f7fb">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<script src="js/theme-boot.js"></script>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main class="auth-page" id="main">
<div class="auth-card">
  <div class="crest"><img src="assets/logo.png" alt="" width="52" height="55"><div><div class="eyebrow">Knowledge Base International Schools</div><h1 style="font-size:1.5rem">Fee portal</h1></div></div>
  <div class="seg" id="modeTabs" role="tablist" aria-label="Log in or first time"><button role="tab" data-mode="claim" aria-selected="false">First time? Start here</button><button role="tab" data-mode="login" aria-selected="true">Log in</button></div>
  <p class="muted small" id="modeHint" style="margin:0 0 16px"></p>
  <div id="msgBox" role="alert" aria-live="assertive"></div>

  <form id="loginForm" novalidate>
    <div class="field"><label for="loginEmail">Email</label><input type="email" id="loginEmail" required autocomplete="username" inputmode="email"></div>
    <div class="field"><label for="loginPassword">Password</label><div class="pw"><input type="password" id="loginPassword" required autocomplete="current-password" ><button type="button" class="btn btn-icon pwt" data-for="loginPassword" aria-label="Show password" aria-pressed="false"></button></div></div>
    <button type="submit" class="btn btn-primary" style="width:100%">Log in</button>
    <p style="text-align:right;margin:10px 0 0"><button type="button" class="link-btn" id="forgotLink">Forgot password?</button></p>
  </form>

  <form id="forgotForm" hidden>
    <div class="field"><label for="forgotEmail">Your account email</label><input type="email" id="forgotEmail" required autocomplete="username"><span class="muted small">We will email you a link to choose a new password.</span></div>
    <button type="submit" class="btn btn-primary" style="width:100%">Send reset link</button>
    <p style="text-align:center;margin:10px 0 0"><button type="button" class="link-btn" id="backLink">Back to log in</button></p>
  </form>

  <form id="claimForm" hidden>
    <div class="field"><label for="claimCode">Your code</label><input type="text" id="claimCode" required autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCDEF1000" style="text-transform:uppercase"><span class="muted small">Parents: the code the school gave for your child. Staff: the staff code from the school owner.</span></div>
    <div class="field"><label for="claimName">Your name</label><input type="text" id="claimName" required autocomplete="name"></div>
    <div class="field"><label for="claimEmail">Email</label><input type="email" id="claimEmail" required autocomplete="username" inputmode="email"></div>
    <div class="field"><label for="claimPassword">Choose a password</label><div class="pw"><input type="password" id="claimPassword" required autocomplete="new-password" minlength="6"><button type="button" class="btn btn-icon pwt" data-for="claimPassword" aria-label="Show password" aria-pressed="false"></button></div></div>
    <button type="submit" class="btn btn-primary" style="width:100%">Create my account</button>
  </form>

  <div class="divider">or</div>
  <button class="btn" id="googleBtn" style="width:100%">Continue with Google</button>
  <p class="muted small" style="text-align:center;margin:18px 0 0">Having trouble? Please contact the school office.</p>
</div>
</main>
<script type="module" src="js/pages/login.js"></script>
<script type="module" src="js/pwa.js"></script>
</body>
</html>
