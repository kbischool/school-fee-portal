<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a new password · KBIS Portal</title>
<meta name="description" content="Knowledge Base International Schools — secure portal for school fees, payments and school information.">
<meta name="theme-color" content="#f4f7fb">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<script src="js/theme-boot.js"></script>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main class="auth-page" id="main"><div class="auth-card">
  <div class="crest"><img src="assets/logo.png" alt="" width="52" height="55"><div><div class="eyebrow">KBIS Fee Portal</div><h1 style="font-size:1.4rem">Choose a new password</h1></div></div>
  <div id="msgBox" role="alert"></div>
  <form id="resetForm">
    <div class="field"><label for="newPassword">New password</label><div class="pw"><input type="password" id="newPassword" required autocomplete="new-password" minlength="6"><button type="button" class="btn btn-icon pwt" data-for="newPassword" aria-label="Show password" aria-pressed="false"></button></div></div>
    <div class="field"><label for="confirmPassword">Confirm new password</label><div class="pw"><input type="password" id="confirmPassword" required autocomplete="new-password" minlength="6"><button type="button" class="btn btn-icon pwt" data-for="confirmPassword" aria-label="Show password" aria-pressed="false"></button></div></div>
    <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%">Set new password</button>
  </form>
  <div id="successBox" hidden><div class="msg ok">Your password has been changed.</div><p style="margin-top:16px"><a class="btn btn-primary" href="index.html" style="width:100%">Go to log in</a></p></div>
  <div id="invalidBox" hidden><div class="msg error">This reset link is invalid or has already been used. Request a new one from the log-in page.</div><p style="margin-top:16px"><a class="btn" href="index.html" style="width:100%">Back to log in</a></p></div>
</div></main>
<script type="module">
import { completePasswordReset } from './js/auth.js';
import { icon } from './js/ui.js';
const q = new URLSearchParams(location.search), oob = q.get('oobCode');
const $ = (s) => document.querySelector(s);
document.querySelectorAll('.pwt').forEach((b) => { b.innerHTML = icon('eye'); b.addEventListener('click', () => { const i = document.getElementById(b.dataset.for), s = i.type === 'password'; i.type = s ? 'text' : 'password'; b.innerHTML = icon(s ? 'eyeoff' : 'eye'); b.setAttribute('aria-label', s ? 'Hide password' : 'Show password'); }); });
if (q.get('mode') !== 'resetPassword' || !oob) { $('#resetForm').hidden = true; $('#invalidBox').hidden = false; }
$('#resetForm').addEventListener('submit', async (e) => {
  e.preventDefault(); $('#msgBox').innerHTML = '';
  if ($('#newPassword').value !== $('#confirmPassword').value) { $('#msgBox').innerHTML = '<div class="msg error">Those passwords do not match.</div>'; return; }
  const b = $('#submitBtn'); b.disabled = true;
  try { await completePasswordReset(oob, $('#newPassword').value); $('#resetForm').hidden = true; $('#successBox').hidden = false; }
  catch (err) {
    if (/weak-password/.test(String(err.message))) { $('#msgBox').innerHTML = '<div class="msg error">Please choose a password with at least 6 characters.</div>'; b.disabled = false; }
    else { $('#resetForm').hidden = true; $('#invalidBox').hidden = false; }
  }
});
</script>
</body>
</html>
