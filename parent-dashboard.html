<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem('kbis-theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KBIS Fee Portal — My Children</title>
<meta name="theme-color" content="#22ade0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KBIS Fees">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="bg-atmosphere"><span></span><span></span><span></span></div>

<div class="topbar">
  <div class="brand">
    <img src="assets/logo.png" alt="KBIS logo" class="logo-mark">
    <div>
      <div class="sub">KBIS Fee Portal</div>
      <h1 id="welcomeName">My Children</h1>
    </div>
  </div>
  <div class="actions">
    <span id="userEmail"></span>
    <button id="logoutBtn">Log out</button>
  </div>
</div>

<div class="shell">
  <div class="term-picker" id="termPicker">
    <button class="active" data-term="term1">1st Term</button>
    <button data-term="term2">2nd Term</button>
    <button data-term="term3">3rd Term</button>
  </div>

  <div id="statBar"></div>

  <div id="ledgerContainer">
    <div class="skeleton-card">
      <div class="sk-row1">
        <div>
          <div class="skeleton-block sk-title"></div>
          <div class="skeleton-block sk-sub"></div>
        </div>
        <div class="skeleton-block sk-ring"></div>
      </div>
      <div class="skeleton-block sk-item"></div>
      <div class="skeleton-block sk-item"></div>
      <div class="skeleton-block sk-item"></div>
    </div>
  </div>

  <div class="add-child-box">
    <button class="btn-link" id="addChildToggle">+ Add another child with a different code</button>
    <form id="addChildForm" class="add-child-form" style="display:none;">
      <input type="text" id="addChildCode" placeholder="Enter their code, e.g. ABDABD1000" required>
      <button type="submit">Link</button>
    </form>
    <div id="addChildMsg"></div>
  </div>
</div>

<script type="module">
import { auth, db, getUserRole, watchAuthState, logout, linkAdditionalStudentCode } from "./js/auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const termPicker = document.getElementById('termPicker');
const ledgerContainer = document.getElementById('ledgerContainer');
const addChildToggle = document.getElementById('addChildToggle');
const addChildForm = document.getElementById('addChildForm');
const addChildMsg = document.getElementById('addChildMsg');
let currentTerm = 'term1';
let linkedStudents = [];
let currentUid = null;

addChildToggle.addEventListener('click', () => {
  addChildForm.style.display = addChildForm.style.display === 'none' ? 'flex' : 'none';
  addChildMsg.innerHTML = '';
});

addChildForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  addChildMsg.innerHTML = '';
  const code = document.getElementById('addChildCode').value;
  const btn = addChildForm.querySelector('button[type="submit"]');
  btn.classList.add('is-loading'); btn.disabled = true;
  try {
    await linkAdditionalStudentCode(currentUid, code);
    addChildMsg.innerHTML = `<div class="msg ok">Added! Their fees now show below.</div>`;
    addChildForm.reset();
    const parentSnap = await getDoc(doc(db, "parents", currentUid));
    linkedStudents = parentSnap.data().linkedStudents || [];
    renderStudents();
  } catch (err) {
    addChildMsg.innerHTML = `<div class="msg error">${err.message}</div>`;
  } finally {
    btn.classList.remove('is-loading'); btn.disabled = false;
  }
});

termPicker.addEventListener('click', (e) => {
  if (!e.target.dataset.term) return;
  currentTerm = e.target.dataset.term;
  [...termPicker.children].forEach(b => b.classList.toggle('active', b === e.target));
  ledgerContainer.innerHTML = `<div class="skeleton-card"><div class="sk-row1"><div><div class="skeleton-block sk-title"></div><div class="skeleton-block sk-sub"></div></div><div class="skeleton-block sk-ring"></div></div><div class="skeleton-block sk-item"></div><div class="skeleton-block sk-item"></div><div class="skeleton-block sk-item"></div></div>`;
  renderStudents();
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await logout();
  window.location.href = 'index.html';
});

function formatMoney(n) {
  return '₦' + Number(n || 0).toLocaleString('en-NG', { minimumFractionDigits: 2 });
}

// Short, original, unattributed lines of encouragement — one shown at
// random per bill, refreshed on every visit. Not quotes from any real
// person, just KBIS's own voice.
const EDU_QUOTES = [
  "Every small effort today becomes tomorrow's big achievement.",
  "Great things are built one term at a time.",
  "Curiosity is the beginning of every great mind.",
  "Consistency in learning shapes tomorrow's leaders.",
  "A child's confidence grows with every question asked.",
  "Knowledge, held with humility, carries the furthest.",
  "The best investment a family can make is in a child's mind.",
  "Small daily lessons quietly build a lifetime of understanding.",
  "Every subject mastered opens a door to another.",
  "Learning well today makes leading well possible tomorrow.",
  "A well-supported student becomes a well-rounded adult.",
  "Patience in learning today builds mastery for life.",
  "Behind every bright future is a season of steady study.",
  "Progress rarely shouts — it simply keeps showing up.",
  "The classroom shapes character as much as it shapes minds."
];
function randomQuote() {
  return EDU_QUOTES[Math.floor(Math.random() * EDU_QUOTES.length)];
}

// Circular progress ring — signature visual per bill. r=32, so
// circumference = 2 * PI * 32 ≈ 201.06
const RING_R = 32;
const RING_CIRC = 2 * Math.PI * RING_R;
function progressRingSvg(pctPaid, cleared, uniqueId) {
  const clamped = Math.max(0, Math.min(100, pctPaid));
  const offset = RING_CIRC - (clamped / 100) * RING_CIRC;
  const gradId = `ringGradient-${uniqueId}`;
  return `
    <div class="progress-ring-wrap">
      <svg width="74" height="74" viewBox="0 0 74 74">
        <defs>
          <linearGradient id="${gradId}" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#22ade0"/>
            <stop offset="100%" stop-color="#7c4dff"/>
          </linearGradient>
        </defs>
        <circle class="progress-ring-track" cx="37" cy="37" r="${RING_R}"/>
        <circle class="progress-ring-bar" cx="37" cy="37" r="${RING_R}"
          style="--ring-circumference:${RING_CIRC}; --ring-offset:${offset}; stroke-dasharray:${RING_CIRC}; stroke:${cleared ? 'var(--good)' : `url(#${gradId})`};"/>
      </svg>
      <div class="progress-ring-label">
        <span class="pct">${Math.round(clamped)}%</span>
        <span class="pct-note">paid</span>
      </div>
    </div>`;
}

const statBar = document.getElementById('statBar');
const printIconSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>`;

function renderStatBar(entries) {
  let totalDue = 0, totalPaid = 0, totalOwed = 0;
  entries.forEach(({ term }) => {
    if (!term) return;
    totalDue += term.totalDue || 0;
    totalPaid += term.totalPaid || 0;
    const balance = typeof term.balance === 'number' ? term.balance : (term.totalDue || 0) - (term.totalPaid || 0);
    if (balance > 0) totalOwed += balance;
  });
  statBar.innerHTML = `
    <div class="stat-bar fade-up">
      <div class="stat-card"><div class="stat-label">Total fees, this term</div><div class="stat-value display money">${formatMoney(totalDue)}</div></div>
      <div class="stat-card accent-good"><div class="stat-label">Paid so far</div><div class="stat-value display money">${formatMoney(totalPaid)}</div></div>
      <div class="stat-card ${totalOwed > 0 ? 'accent-due' : 'accent-good'}"><div class="stat-label">${totalOwed > 0 ? 'Outstanding' : 'Balance'}</div><div class="stat-value display money">${formatMoney(totalOwed)}</div></div>
    </div>`;
}

// Prints just one child's ledger card, cleanly, using the shared @media
// print rules in css/style.css (everything else on the page is hidden).
function printCard(card) {
  document.querySelectorAll('.print-target').forEach(el => el.classList.remove('print-target'));
  card.classList.add('print-target');
  window.print();
}

async function renderStudents() {
  if (!linkedStudents.length) {
    statBar.innerHTML = '';
    ledgerContainer.innerHTML = `<div class="empty-note">No student records are linked to your account yet. Contact the school office.</div>`;
    return;
  }

  ledgerContainer.innerHTML = '';
  let cardIndex = 0;
  const statEntries = [];
  for (const studentId of linkedStudents) {
    const snap = await getDoc(doc(db, "students", studentId));
    if (!snap.exists()) continue;
    const student = snap.data();
    const term = student.terms && student.terms[currentTerm];
    statEntries.push({ term });

    const card = document.createElement('div');
    card.className = 'ledger-card fade-up';
    card.style.animationDelay = `${cardIndex * 0.08}s`;
    cardIndex++;

    if (!term) {
      card.innerHTML = `
        <div class="ledger-head">
          <div>
            <div class="student-name display">${student.name}</div>
            <div class="student-class">${student.class || ''}</div>
          </div>
        </div>
        <div class="empty-note">Records for this term aren't available yet.</div>`;
      ledgerContainer.appendChild(card);
      continue;
    }

    const balance = typeof term.balance === 'number' ? term.balance : (term.totalDue || 0) - (term.totalPaid || 0);
    const cleared = balance <= 0;
    const pctPaid = term.totalDue > 0 ? (term.totalPaid / term.totalDue) * 100 : (cleared ? 100 : 0);

    const rowsHtml = (term.items || []).map(item => `
      <div class="ledger-row">
        <span class="label">${item.label}</span>
        <span class="money">${formatMoney(item.amount)}</span>
      </div>`).join('');

    card.innerHTML = `
      <div class="ledger-head">
        <div>
          <div class="student-name display">${student.name}</div>
          <div class="student-class">${student.class || ''}</div>
        </div>
        ${progressRingSvg(pctPaid, cleared, studentId + '-' + currentTerm)}
      </div>
      <div class="ledger-rows">${rowsHtml || '<div class="ledger-row"><span class="label">No itemised charges recorded.</span></div>'}</div>
      <div class="ledger-total">
        <span>Total paid: <span class="money">${formatMoney(term.totalPaid)}</span> of <span class="money">${formatMoney(term.totalDue)}</span></span>
        <span class="amount money ${cleared ? 'cleared' : 'due'}">${formatMoney(Math.abs(balance))} ${cleared ? 'credit' : 'due'}</span>
      </div>
      <div class="quote-strip"><span class="quote-mark">&ldquo;</span>${randomQuote()}</div>
      <div class="card-actions">
        <button type="button" class="btn-ghost btn-print">${printIconSvg} Print statement</button>
      </div>`;
    card.querySelector('.btn-print').addEventListener('click', () => printCard(card));
    ledgerContainer.appendChild(card);
  }
  renderStatBar(statEntries);
}

watchAuthState(async (user) => {
  if (!user) { window.location.href = 'index.html'; return; }
  const { role, data } = await getUserRole(user.uid);
  if (role !== 'parent') { window.location.href = 'index.html'; return; }

  currentUid = user.uid;
  document.getElementById('welcomeName').textContent = data.displayName ? `Welcome, ${data.displayName}` : 'My Children';
  document.getElementById('userEmail').textContent = data.email || '';
  linkedStudents = data.linkedStudents || [];
  renderStudents();
});
</script>

<script src="js/pwa-install.js"></script>
</body>
</html>
