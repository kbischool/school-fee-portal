<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KBIS Fee Portal — Set New Password</title>
<meta name="theme-color" content="#22ade0">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="bg-atmosphere"><span></span><span></span><span></span></div>

<div class="center-shell">
  <div class="auth-card">

    <div class="crest-row">
      <img src="assets/logo.png" alt="KBIS logo" class="logo-mark">
      <div>
        <div class="eyebrow">KBIS Fee Portal</div>
        <h2>Set a new password</h2>
      </div>
    </div>

    <div id="msgBox"></div>

    <!-- Shown only once the parent actually clicks "Set new password" below —
         nothing about this page contacts Firebase just from being opened,
         which is what keeps the link safe from email security scanners. -->
    <form id="resetForm">
      <p id="emailLine" style="font-size:13px;color:var(--ink-soft);margin:0 0 16px;"></p>
      <div class="field">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" required minlength="6" autocomplete="new-password">
        <div class="hint">At least 6 characters.</div>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Set new password</button>
    </form>

    <div id="successBox" style="display:none; text-align:center;">
      <div class="msg ok">Your password has been updated.</div>
      <a href="index.html" class="btn-primary" style="display:block; text-decoration:none; text-align:center; box-sizing:border-box;">Go to log in</a>
    </div>

    <div id="invalidBox" style="display:none; text-align:center;">
      <div class="msg error">This reset link is no longer valid — it may have expired, already been used, or been opened automatically by your email app's security scan before you clicked it.</div>
      <a href="index.html" class="btn-primary" style="display:block; text-decoration:none; text-align:center; box-sizing:border-box;">Request a new link</a>
    </div>

  </div>
</div>

<script type="module">
import { completePasswordReset } from "./js/auth.js";

const params = new URLSearchParams(window.location.search);
const mode = params.get('mode');
const oobCode = params.get('oobCode');

const resetForm = document.getElementById('resetForm');
const successBox = document.getElementById('successBox');
const invalidBox = document.getElementById('invalidBox');
const msgBox = document.getElementById('msgBox');
const submitBtn = document.getElementById('submitBtn');

function showMsg(text) {
  msgBox.innerHTML = `<div class="msg error">${text}</div>`;
}

if (mode !== 'resetPassword' || !oobCode) {
  resetForm.style.display = 'none';
  invalidBox.style.display = 'block';
} else {
  document.getElementById('emailLine').textContent = 'Choose a new password for your account below.';
}

resetForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  msgBox.innerHTML = '';

  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  if (newPassword !== confirmPassword) {
    showMsg("Those passwords don't match — try again.");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Setting password…';

  try {
    // This is the ONLY place the reset code is actually used — triggered
    // by a genuine button click, not by the page simply loading.
    await completePasswordReset(oobCode, newPassword);
    resetForm.style.display = 'none';
    successBox.style.display = 'block';
  } catch (err) {
    const m = String(err.message || '');
    resetForm.style.display = 'none';
    invalidBox.style.display = 'block';
    if (m.includes('auth/weak-password')) {
      resetForm.style.display = 'block';
      invalidBox.style.display = 'none';
      showMsg('Please choose a password with at least 6 characters.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Set new password';
    }
  }
});
</script>

<script src="js/pwa-install.js"></script>
</body>
</html>
